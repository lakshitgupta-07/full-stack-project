<div class="sidebar-header">
    <div class="chat-title">
        <h1>CHATS</h1>
        <h1>{{ currentUser()?.username }}</h1>
    </div>

    <button class="new-chat-btn" (click)="showDialog = true">
        New Chat
    </button>

    <button class="new-group-btn" (click)="openCreateGroup()">
        New Group
    </button>
</div>

<div class="search-box">
    <input type="text" placeholder="search..." [(ngModel)]="searchQuery" />
</div>

<div class="thread-list">
    @for(thread of filteredThreads; track thread._id) {
    <div class="thread-item" [class.active]="chatService.selectedThread()?._id === thread._id" (click)="selectThread(thread)">
        <div class="thread-avatar">
            @if(thread.isGroup) {
                <img [src]="thread.groupAvatar?.url || 'project-app/public/assets/default-avatar.png'" alt="Group" />
            } @else {
                <img [src]="getOtherParticipants(thread)?.avatar?.url || '/assets/default-avatar.png'" alt="Avatar" />
            }
        </div>
        <div class="thread-info">
            <h4>
                @if(thread.isGroup) {
                    {{ thread.groupName }}
                } @else {
                    {{ getOtherParticipants(thread)?.username }}
                }
            </h4>
        </div>
    </div>
    } @empty {
    <div class="thread-item">
        No Conversation
    </div>
    }
</div>

@if(showDialog) {
  <app-new-chat-dialog (close)="showDialog = false"></app-new-chat-dialog>
}
<app-create-group-dialog #groupDialog></app-create-group-dialog>
