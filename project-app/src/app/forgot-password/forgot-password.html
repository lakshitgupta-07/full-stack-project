<div class="auth-panel">
  <h1>Forgot Password</h1>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="Enter Email">

    <p class="error" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid">
      Enter a valid email
    </p>

    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading">
      {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
    </button>
  </form>

  <a routerLink="/login">Back to login</a>
</div>
