<div class="auth-panel">
  <h1>Reset Password</h1>

  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <label for="password">New Password</label>
    <input id="password" type="password" formControlName="password" placeholder="New Password">

    <p class="error" *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.invalid">
      Enter a valid password
    </p>

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm Password">

    <p class="error" *ngIf="resetPasswordForm.errors?.['passwordMismatch'] && resetPasswordForm.get('confirmPassword')?.touched">
      Passwords do not match
    </p>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" [disabled]="resetPasswordForm.invalid || isLoading">
      {{ isLoading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>

  <a routerLink="/login">Back to login</a>
</div>
