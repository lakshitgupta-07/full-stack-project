<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-icon">🔒</span>
      <h3>{{ isInitialPasswordSetup ? 'Set Password' : 'Change Password' }}</h3>
      <p class="auth-subtitle">
        {{ isInitialPasswordSetup
          ? 'Create a password to secure your account'
          : 'Enter your current password and choose a new one' }}
      </p>
    </div>

    <div class="auth-body">
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

        <div class="field" *ngIf="!isInitialPasswordSetup">
          <label class="field-label">Old Password</label>
          <input type="password" class="form-control" formControlName="oldPassword">
          <div class="field-error" *ngIf="
              passwordForm.get('oldPassword')?.touched &&
              passwordForm.get('oldPassword')?.invalid
            ">
            Old password is required
          </div>
        </div>

        <div class="field">
          <label class="field-label">New Password</label>
          <input type="password" class="form-control" formControlName="newPassword">
          <div class="field-error" *ngIf="
              passwordForm.get('newPassword')?.touched &&
              passwordForm.get('newPassword')?.invalid
            ">
            Enter a valid password
          </div>
        </div>

        <div class="field field--last">
          <label class="field-label">Confirm Password</label>
          <input type="password" class="form-control" formControlName="confirmPassword">
          <div class="field-error" *ngIf="
              passwordForm.errors?.['passwordMismatch'] &&
              passwordForm.get('confirmPassword')?.touched
            ">
            Passwords do not match
          </div>
        </div>

        <div class="auth-actions">
          <button type="button" class="btn btn-outline" routerLink="/homePage">
            Cancel
          </button>

          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span class="spinner" *ngIf="isLoading"></span>
            {{ isLoading ? 'Updating...' : (isInitialPasswordSetup ? 'Set Password' : 'Change Password') }}
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
