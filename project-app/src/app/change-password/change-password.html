<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card shadow">

        <div class="card-header bg-warning text-dark">

          <h3 class="mb-0">

            {{ isInitialPasswordSetup ? 'Set Password' : 'Change Password' }}

          </h3>

        </div>

        <div class="card-body">

          <form
            [formGroup]="passwordForm"
            (ngSubmit)="onSubmit()">

            <div
              class="mb-3"
              *ngIf="!isInitialPasswordSetup">

              <label class="form-label">

                Old Password

              </label>

              <input
                type="password"
                class="form-control"
                formControlName="oldPassword">

              <div
                class="text-danger mt-1"
                *ngIf="
                  passwordForm.get('oldPassword')?.touched &&
                  passwordForm.get('oldPassword')?.invalid
                ">

                Old Password is required

              </div>

            </div>

            <div class="mb-3">

              <label class="form-label">

                New Password

              </label>

              <input
                type="password"
                class="form-control"
                formControlName="newPassword">

              <div
                class="text-danger mt-1"
                *ngIf="
                  passwordForm.get('newPassword')?.touched &&
                  passwordForm.get('newPassword')?.invalid
                ">

                Enter a valid password

              </div>

            </div>

            <div class="mb-4">

              <label class="form-label">

                Confirm Password

              </label>

              <input
                type="password"
                class="form-control"
                formControlName="confirmPassword">

              <div
                class="text-danger mt-1"
                *ngIf="
                  passwordForm.errors?.['passwordMismatch'] &&
                  passwordForm.get('confirmPassword')?.touched
                ">

                Passwords do not match

              </div>

            </div>

            <div class="d-flex justify-content-between">

              <button
                class="btn btn-secondary"
                routerLink="/homePage">

                Cancel

              </button>

              <button
                class="btn btn-warning"
                [disabled]="isLoading">

                {{ isLoading ? 'Updating...' : (isInitialPasswordSetup ? 'Set Password' : 'Change Password') }}

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
