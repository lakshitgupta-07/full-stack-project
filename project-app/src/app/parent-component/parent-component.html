<div class="page-header">
  <h2>Parent Component</h2>
  <button type="button" (click)="moveToProfilePage()">Back</button>
</div>
<div style="border: 1px solid black; padding: 20px">
  <form [formGroup]="tempForm">
    <div>
      <label>Username: </label>

      <input type="text" formControlName="userName" />
    </div>

    <br />

    <div>
      <label>Age: </label>

      <input type="number" formControlName="age" />
    </div>

    <br />

    <div>
      <label>Address: </label>

      <input type="text" formControlName="address" />
    </div>

    <br />

    @if (selectedIndex === null) {
      <button type="button" (click)="onAddItem()">Add User</button>
    }

    @if (selectedIndex !== null) {
      <button type="button" (click)="saveChanges()">Save Changes</button>

      <button type="button" (click)="cancelChange()">Cancel</button>
    }
  </form>

  <hr />

  <button type="button" (click)="toggleChild()">
    @if (showChild) {
      Hide Users
    } @else {
      View Users
    }
  </button>

  @if (showChild) {
    <app-child-component> </app-child-component>
  }
</div>
